# MySQL for local development.
#
# Published on host port 3307, not 3306, so this can run alongside a native
# MySQL install (Homebrew, etc.) without a port conflict. Set DB_PORT=3307 in
# your .env to point the app here.
#
#   docker compose up -d      start
#   docker compose down       stop, keep data
#   docker compose down -v    stop and wipe the database entirely
#
services:
  db:
    image: mysql:8.4
    container_name: good_fit_mysql
    restart: unless-stopped
    ports:
      - '3307:3306'
    environment:
      # Matches the empty DB_PASSWORD in .env.example. Local development only.
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      # Creates the database on first boot, so `npm run db:create` is not needed.
      MYSQL_DATABASE: good_fit
    volumes:
      - good_fit_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  good_fit_mysql_data:
